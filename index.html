<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Isaac's Law Cram Quiz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0e1a; color: #e8eaf0; min-height: 100vh; padding: 16px; padding-bottom: 32px; overflow-x: hidden; }
  .container { max-width: 640px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 16px; background: #131829; border-radius: 14px; border: 1px solid #1f2640; }
  .title { font-size: 18px; font-weight: 700; color: #22C55E; }
  .subtitle { font-size: 12px; color: #8b95b0; margin-top: 2px; }
  .score { text-align: right; font-size: 13px; }
  .score-num { font-size: 22px; font-weight: 700; color: #22C55E; }
  .score-pct { font-size: 11px; color: #8b95b0; margin-top: 2px; }
  .topic-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 20px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .topic-chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; padding: 10px 16px; background: #131829; border: 1px solid #1f2640; border-radius: 22px; color: #8b95b0; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
  .chip.active { background: #22C55E; color: #0a0e1a; border-color: #22C55E; }
  .chip:active { transform: scale(0.96); }
  .card { background: #131829; border-radius: 18px; padding: 22px; border: 1px solid #1f2640; margin-bottom: 16px; }
  .topic-label { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; color: #22C55E; background: rgba(34, 197, 94, 0.1); padding: 4px 10px; border-radius: 6px; margin-bottom: 14px; }
  .topic-label.scenario { color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
  .topic-label.topicid { color: #a855f7; background: rgba(168, 85, 247, 0.1); }
  .question { font-size: 17px; line-height: 1.5; font-weight: 500; margin-bottom: 22px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option { background: #1a2138; border: 1.5px solid #2a3252; color: #e8eaf0; padding: 16px 18px; border-radius: 12px; font-size: 15px; text-align: left; cursor: pointer; transition: all 0.15s; line-height: 1.4; font-family: inherit; width: 100%; display: flex; align-items: center; gap: 12px; }
  .option:active { transform: scale(0.98); }
  .option:hover { border-color: #4b5680; background: #212a48; }
  .option.correct { background: rgba(34, 197, 94, 0.15); border-color: #22C55E; color: #4ade80; }
  .option.wrong { background: rgba(239, 68, 68, 0.15); border-color: #ef4444; color: #f87171; }
  .option.disabled { cursor: default; pointer-events: none; }
  .option .letter { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; background: #2a3252; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .option.correct .letter { background: #22C55E; color: #0a0e1a; }
  .option.wrong .letter { background: #ef4444; color: #fff; }
  .feedback { margin-top: 16px; padding: 14px 16px; background: #0f1424; border-radius: 10px; border-left: 3px solid #22C55E; font-size: 13.5px; line-height: 1.5; color: #b8c0d6; display: none; }
  .feedback.show { display: block; }
  .feedback strong { color: #22C55E; }
  .feedback.wrong-feedback { border-left-color: #ef4444; }
  .feedback.wrong-feedback strong { color: #f87171; }
  .next-btn { display: block; width: 100%; background: #22C55E; color: #0a0e1a; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 16px; transition: all 0.15s; font-family: inherit; }
  .next-btn:active { transform: scale(0.98); background: #16a34a; }
  .next-btn:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: #131829; border: 1px solid #1f2640; border-radius: 10px; padding: 10px; text-align: center; }
  .stat-num { font-size: 18px; font-weight: 700; color: #e8eaf0; }
  .stat-label { font-size: 10px; color: #8b95b0; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.4px; }
  .stat.green .stat-num { color: #22C55E; }
  .stat.red .stat-num { color: #f87171; }
  .footer-actions { display: flex; gap: 8px; margin-top: 12px; }
  .reset-btn { flex: 1; background: transparent; border: 1px solid #2a3252; color: #8b95b0; padding: 10px; border-radius: 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .reset-btn:active { background: #1a2138; }
  .complete { text-align: center; padding: 40px 20px; }
  .complete h2 { color: #22C55E; font-size: 24px; margin-bottom: 12px; }
  .complete p { color: #b8c0d6; margin-bottom: 8px; }
  .complete .big-num { font-size: 48px; font-weight: 800; color: #22C55E; margin: 16px 0; }
</style>
</head>

<div class="container">
  <header>
    <div>
      <div class="title">Isaac's Law Cram</div>
      <div class="subtitle">Exam Thu 21 May - 134 questions</div>
    </div>
    <div class="score">
      <div class="score-num" id="scoreNum">0/0</div>
      <div class="score-pct" id="scorePct">-</div>
    </div>
  </header>
  <div class="topic-chips" id="topicChips"></div>
  <div id="quizArea"></div>
  <div class="stats">
    <div class="stat green"><div class="stat-num" id="streakNum">0</div><div class="stat-label">Streak</div></div>
    <div class="stat"><div class="stat-num" id="seenNum">0</div><div class="stat-label">Seen</div></div>
    <div class="stat red"><div class="stat-num" id="missedNum">0</div><div class="stat-label">Missed</div></div>
  </div>
  <div class="footer-actions">
    <button class="reset-btn" onclick="resetSession()">Reset Session</button>
    <button class="reset-btn" onclick="reshuffleQueue()">Shuffle</button>
  </div>
</div>
<script>
const QUESTIONS = [
  { topic:"Topic ID", q:"A question asks: 'List 3 grounds that could result in the imposition of a disqualification order against a company director.' Which mnemonic applies?", options:["LIFO (Last In First Out)","RVPST (employee vs IC)","MUFFI (Misconduct, Unfit, Fraud, Failure to pay, Insolvent)","NOPC (administrator role)"], correct:2, exp:"MUFFI = director disqualification grounds. NOT employment law concepts like performance/attendance." },
  { topic:"Topic ID", q:"A question mentions 'an employee was dismissed after 8 months due to pregnancy'. What topic area?", options:["Director disqualification","Employment Law - automatic unfair dismissal","Constructive dismissal","Vicarious liability"], correct:1, exp:"Pregnancy = AUTOMATICALLY unfair dismissal. Bypasses the 1-year service rule. Topic: Employment Law." },
  { topic:"Topic ID", q:"'Performance review and attendance records' - these are criteria for what?", options:["Director disqualification grounds","REDUNDANCY selection criteria (LSPADE)","Aggressive practice indicators","Money laundering tests"], correct:1, exp:"Performance/attendance = REDUNDANCY selection criteria (LIFO, Skills, Performance, Attendance, Discipline, Experience). NEVER use these for director disqualification." },
  { topic:"Topic ID", q:"A question states 'company has unpaid debt of £900 unpaid for 4 weeks'. What topic?", options:["Consumer protection","Compulsory winding up (creditor petition)","Money laundering","Wrongful trading"], correct:1, exp:"£750 unpaid for 3 weeks = grounds for compulsory winding up petition. Topic: Liquidation/Winding Up." },
  { topic:"Topic ID", q:"'Snail in a ginger beer' - this case (Donoghue v Stevenson) establishes what?", options:["Postal rule for contracts","Exemption clause incorporation","Duty of care + neighbour principle (Tort)","Vicarious liability"], correct:2, exp:"Donoghue v Stevenson 1932 = foundational TORT case. Duty of care + neighbour principle. Always cite for negligence questions." },
  { topic:"Topic ID", q:"A question asks about REMOVAL of a director - what's needed?", options:["High Court order (2-15 years)","Ordinary resolution (51%) + 28 days special notice","Special resolution (75%)","Disqualification order under CDDO 2002"], correct:1, exp:"REMOVAL = ordinary resolution by shareholders + 28-day special notice. DIFFERENT from disqualification (which is High Court)." },
  { topic:"Topic ID", q:"A question asks about DISQUALIFICATION of a director - what's needed?", options:["Ordinary resolution + 28 days","Special resolution + 75%","High Court order under CDDO 2002 (2-15 years)","Notification to Companies House"], correct:2, exp:"DISQUALIFICATION = court order. Companies Directors Disqualification (NI) Order 2002. 2-15 years. Bans from ANY company." },
  { topic:"Topic ID", q:"A question mentions 'deal in price-affected securities' - what topic?", options:["Money laundering","INSIDER DEALING (CJA 1993 s.52)","Wrongful trading","Director duties"], correct:1, exp:"'Price-affected securities' = INSIDER DEALING under Criminal Justice Act 1993 s.52. Max 10 years on indictment." },
  { topic:"Topic ID", q:"A question mentions 'concealing or disguising criminal property' - what topic?", options:["Insider dealing","Director fraud","MONEY LAUNDERING (POCA 2002)","Wrongful trading"], correct:2, exp:"'Criminal property' / 'concealing' = MONEY LAUNDERING. Proceeds of Crime Act 2002. Max 15 years for laundering itself." },
  { topic:"Topic ID", q:"FIRST auditor of a company - who appoints?", options:["Shareholders at AGM","DIRECTORS","Companies House","Court"], correct:1, exp:"FIRST auditor = directors. SUBSEQUENT auditors = shareholders by ordinary resolution. Different rules." },
  { topic:"Topic ID", q:"SUBSEQUENT auditors of a company - who appoints?", options:["Directors","SHAREHOLDERS by ordinary resolution at AGM","Companies House","Court"], correct:1, exp:"After the first audit period, shareholders appoint. Same mechanism as removing - ordinary resolution + 28-day special notice." },
  { topic:"Topic ID", q:"A question mentions 'anniversary of the last day of the month of incorporation' - what's being calculated?", options:["AGM deadline","ACCOUNTING REFERENCE DATE (ARD)","Filing deadline (that's 9 mo private / 6 mo public AFTER ARD)","Statement of particulars deadline"], correct:1, exp:"ARD = anniversary of LAST DAY of MONTH of incorporation. The ARD is the date itself. Filing deadline is AFTER the ARD." },
  { topic:"Topic ID", q:"A question describes a trader who keeps calling a customer despite her asking to stop - what topic?", options:["Insider dealing","CONSUMER LAW - aggressive practice","Constructive dismissal","Money laundering"], correct:1, exp:"Aggressive practice = Consumer Rights / Unfair Trading Regs 2008. Refusal to cease unwanted communication is a classic example." },
  { topic:"Topic ID", q:"A question asks 'rank these debts in order of priority on liquidation' - what's your strategy?", options:["Attempt confidently","RANKING - SKIP IF UNSURE (first wrong = 0 marks per examiner warning)","Guess randomly","Always put fixed charge first"], correct:1, exp:"Examiner explicitly warned: 'if last item first = 0 marks even if rest is right'. Strategy: SKIP unless 100% sure of first item." },
  { topic:"Topic ID", q:"'Director sells shares using inside info before announcement' - what topic?", options:["Money laundering","Director duty of conflict only","INSIDER DEALING (CJA 1993)","Wrongful trading"], correct:2, exp:"Trading securities using non-public info = INSIDER DEALING. Note: can ALSO be a director duty breach, but the specific offence is insider dealing." },
  { topic:"Topic ID", q:"'Director continues trading knowing company is insolvent' - what offence?", options:["Insider dealing","Fraudulent trading","WRONGFUL TRADING (Insolvency Order)","Director removal"], correct:2, exp:"Wrongful trading = knew or should have known no reasonable prospect of avoiding insolvent liquidation. Only liquidator can sue. Civil sanctions + disqualification up to 15 years." },
  { topic:"Topic ID", q:"Question gives a contract scenario where an exemption clause was on the BACK of a ticket given AFTER the deal - which rule applies?", options:["Contra proferentem","EXEMPTION CLAUSE INCORPORATION TIMING (must be BEFORE/AT contract formation)","Postal rule","Main purpose rule"], correct:1, exp:"Clause must be brought to attention BEFORE or AT contract formation (Thornton v Shoe Lane Parking, Olley v Marlborough). Given after = NOT incorporated." },
  { topic:"Topic ID", q:"For a MEMBERS' voluntary winding up, the company must be:", options:["Insolvent","SOLVENT (with declaration of solvency within 5 weeks of GM)","Either","Trading 12+ months"], correct:1, exp:"MEMBERS' voluntary = company MUST be solvent. Directors swear declaration of solvency. NOT 'may be' - must be." },
  { topic:"Topic ID", q:"To alter an Article in the Articles of Association - what's the process?", options:["Ordinary resolution","Director vote","SPECIAL resolution (75%) at GM + 14 days notice + 15 days to Registrar","Court order"], correct:2, exp:"Articles change = Special resolution (75%). 14 days notice to members. Registrar informed within 15 days. NOT 'fair' - SPECIAL." },
  { topic:"Topic ID", q:"An employee resigns because employer cut their pay. What dismissal claim?", options:["Unfair dismissal","Wrongful dismissal","CONSTRUCTIVE dismissal","Redundancy"], correct:2, exp:"Employee TERMINATES because of employer's fundamental breach (pay cut = Industrial Rubber Products v Gillon). 1 year service required. CONSTRUCTIVE." },
  { topic:"Employment", q:"What is the main piece of legislation governing employment in Northern Ireland?", options:["Employment Rights Act 1996","Employment Rights (Northern Ireland) Order 1996","The Equality Act 2010","The Companies Act 2006"], correct:1, exp:"NI uses the (NI) Order 1996." },
  { topic:"Employment", q:"Within how many months of starting must an employer provide a statement of particulars?", options:["1 month","2 months","3 months","6 months"], correct:1, exp:"2 months from start date." },
  { topic:"Employment", q:"Minimum continuous service required to claim UNFAIR dismissal?", options:["6 months","1 year","2 years","No requirement"], correct:1, exp:"1 year for unfair dismissal. WRONGFUL = no service requirement." },
  { topic:"Employment", q:"Tom uses his own laptop, invoices per job, sets own hours. Most likely:", options:["An employee","An independent contractor","A casual worker","A director"], correct:1, exp:"Tools + financial risk + control = IC." },
  { topic:"Employment", q:"Contract OF service means:", options:["Employee","Independent contractor","Agency worker","Apprentice"], correct:0, exp:"OF service = employee. FOR services = IC." },
  { topic:"Employment", q:"Which is NOT an automatically unfair ground?", options:["Pregnancy","Whistleblowing","Capability","Jury duty"], correct:2, exp:"Capability is potentially FAIR. Others are auto-unfair." },
  { topic:"Employment", q:"Time limit for unfair dismissal claim:", options:["3 months","6 months","1 year","6 years"], correct:0, exp:"3 months. Wrongful = 6 years." },
  { topic:"Employment", q:"Two main types of misconduct dismissal:", options:["Petty and serious","Gross and continuous","Minor and major","Direct and indirect"], correct:1, exp:"GROSS (one-off + fair process) vs CONTINUOUS (warning system)." },
  { topic:"Employment", q:"Warning system for continuous misconduct:", options:["Written then Verbal then Final","Verbal then Written then Final Written then Dismiss","Final then Written then Verbal","One warning then dismiss"], correct:1, exp:"V-W-FW-D." },
  { topic:"Employment", q:"Minimum service for redundancy payment:", options:["6 months","1 year","2 years","5 years"], correct:2, exp:"2 years." },
  { topic:"Employment", q:"100+ redundancies - consultation period:", options:["30 days","45 days","90 days","6 months"], correct:2, exp:"90 days before first dismissal. '100 = 90'." },
  { topic:"Employment", q:"Redundancy pay for 25yo per year of service:", options:["Half week","1 week","1.5 weeks","2 weeks"], correct:1, exp:"<21=half, 21-41=1, 42+=1.5. Cap: 20yrs, GBP400/wk." },
  { topic:"Employment", q:"Lottie dismissed without notice (4wk contract notice), 8 months service. Best claim:", options:["Unfair","Wrongful","Constructive","Redundancy"], correct:1, exp:"Wrongful = no notice. No service requirement." },
  { topic:"Employment", q:"3 remedies for unfair dismissal:", options:["Refund Reissue Resign","Reinstatement Re-engagement Compensation","Reduction Restoration Recovery","Removal Return Reissue"], correct:1, exp:"R-R-C." },
  { topic:"Data Protection", q:"GDPR stands for:", options:["General Data Privacy Reg","General Data Protection Regulation","Government Data Protocol","Global Digital Protection"], correct:1, exp:"GDPR." },
  { topic:"Data Protection", q:"Max ICO civil penalty:", options:["GBP100k","GBP250k","GBP500k","GBP1m"], correct:2, exp:"GBP500k. SSD conditions." },
  { topic:"Data Protection", q:"NOT one of 3 conditions for GBP500k:", options:["Serious violation","Substantial damage","Deliberate","Financial loss to subject"], correct:3, exp:"SSD only." },
  { topic:"Data Protection", q:"NOT one of 4 ICO notices:", options:["Information","Assessment","Enforcement","Compliance"], correct:3, exp:"I-A-E-P." },
  { topic:"Data Protection", q:"Right to be forgotten = which right?", options:["Information","Erasure","Portability","Object"], correct:1, exp:"Erasure = forgotten." },
  { topic:"Data Protection", q:"Data Controller decides:", options:["Who holds data","PURPOSE and MANNER of processing","Who handles data","ICO regulator"], correct:1, exp:"Controller decides WHY and HOW." },
  { topic:"Data Protection", q:"Which is sensitive data:", options:["Name and address","Bank details","Trade union membership","Email"], correct:2, exp:"Trade union, political, racial/ethnic." },
  { topic:"Data Protection", q:"If DP rights breached, FIRST step:", options:["Sue controller","Lodge ICO complaint","Apply to High Court","Local council"], correct:1, exp:"ICO complaint first." },
  { topic:"Data Protection", q:"NOT an obligation on Data Controller:", options:["Process fairly","Keep accurate","Retain indefinitely","Protect from unauth processing"], correct:2, exp:"NO LONGER than necessary." },
  { topic:"Data Protection", q:"Data must not be transferred outside of:", options:["UK","England and Wales","EEC without adequate controls","NI"], correct:2, exp:"EEC limit." },
  { topic:"Business Orgs", q:"Ordinary partnerships governed by:", options:["Companies Act 2006","Partnership Act 1890","LLP Act 2000","LP Act 1907"], correct:1, exp:"PA 1890." },
  { topic:"Business Orgs", q:"T/F: A sole trader is NOT permitted to hire employees.", options:["True","False"], correct:1, exp:"False. Sole = sole ownership." },
  { topic:"Business Orgs", q:"Min share capital for public company:", options:["None","GBP10k","GBP50k","GBP100k"], correct:2, exp:"GBP50k. 1/4 paid = GBP12,500." },
  { topic:"Business Orgs", q:"Public co AGM deadline from year end:", options:["3 months","6 months","9 months","12 months"], correct:1, exp:"6 months public. Private none." },
  { topic:"Business Orgs", q:"Which can list shares:", options:["Public only","Private only","Both","Neither"], correct:0, exp:"Public only." },
  { topic:"Business Orgs", q:"Sleeping partner liability:", options:["Limited","Unlimited","None","Joint and several only"], correct:1, exp:"Unlimited." },
  { topic:"Business Orgs", q:"Limited liability partners only in:", options:["Any partnership","Ordinary","LP or LLP","Sole trade"], correct:2, exp:"LP (1907) or LLP (2000)." },
  { topic:"Business Orgs", q:"COMMON to sole trader + partnership:", options:["Separate legal entity","Specific legislation","Unlimited liability","Annual accounts filing"], correct:2, exp:"Unlimited liability + not separate entity." },
  { topic:"Business Orgs", q:"Public co accounts filing deadline:", options:["3mo","6mo","9mo","12mo"], correct:1, exp:"6mo public, 9mo private." },
  { topic:"Business Orgs", q:"Min directors private company:", options:["1","2","3","None"], correct:0, exp:"1 private, 2 public." },
  { topic:"Directors", q:"Min age to be a director:", options:["18","16","21","None"], correct:1, exp:"16." },
  { topic:"Directors", q:"First directors appointed:", options:["First AGM","By shareholders at incorporation","In application for registration","After 1 year"], correct:2, exp:"Application for registration; effective on incorporation." },
  { topic:"Directors", q:"Disqualification orders made by:", options:["Companies House","Magistrates","High Court","ICO"], correct:2, exp:"High Court under CDDO 2002." },
  { topic:"Directors", q:"Max disqualification (unfit):", options:["5yr","10yr","15yr","Life"], correct:2, exp:"2-15 years." },
  { topic:"Directors", q:"Shadow director is:", options:["Non-exec","Replacement","Person on whose directions board acts","Undisclosed shareholder"], correct:2, exp:"Behind the scenes control." },
  { topic:"Directors", q:"NOT a director duty under CA 2006:", options:["Act within powers","Promote success","Maximise dividends","Avoid conflicts"], correct:2, exp:"Maximise dividends is NOT statutory." },
  { topic:"Directors", q:"Public co directors retire on rotation every:", options:["1yr","3yr","5yr","10yr"], correct:1, exp:"3 years." },
  { topic:"Directors", q:"To REMOVE a director:", options:["Special 75%","Ordinary + 28 day special notice","Court","Unanimous board"], correct:1, exp:"Ordinary + 28 days. NOT disqualification." },
  { topic:"Directors", q:"NOT a ground for DISQUALIFICATION:", options:["General misconduct","Unfitness in insolvent co","Wrongful trading","Poor performance"], correct:3, exp:"Performance is EMPLOYMENT. MUFFI for disqualification." },
  { topic:"Directors", q:"5 types of director EXCEPT:", options:["Executive","Non-executive","Shadow","Reserve"], correct:3, exp:"Exec/Non-exec/De facto/Shadow/Managing." },
  { topic:"Directors", q:"REMOVAL vs DISQUALIFICATION:", options:["Both court","Both ordinary res","Removal=company vote, Disqualification=court","Removal=court, Disqualification=company"], correct:2, exp:"Removal: shareholders (51%, 28 day notice). Disqualification: court (CDDO 2002, 2-15 yr ban)." },
  { topic:"Directors", q:"Boston Deep Sea Fishing v Ansell (1888) established:", options:["Act within powers","Avoid conflicts of interest","Disclose interest","Independent judgement"], correct:1, exp:"Director took secret commission - liable. Avoid conflicts." },
  { topic:"Auditors", q:"FIRST auditor appointed by:", options:["Shareholders at AGM","Directors","Companies House","Registrar"], correct:1, exp:"Directors." },
  { topic:"Auditors", q:"Auditor removed by:", options:["Ordinary + special notice","Special resolution","Director vote","Court order"], correct:0, exp:"Ordinary + 28 day notice." },
  { topic:"Auditors", q:"PLC must have:", options:["Bookkeeper","Compliance officer","Qualified company secretary","Internal auditor"], correct:2, exp:"Qualified secretary required for PLC." },
  { topic:"Auditors", q:"Co registered 10 May 2024. First ARD:", options:["10 May 2025","30 Apr 2025","31 May 2025","31 Dec 2024"], correct:2, exp:"Last day of month of incorporation = 31 May." },
  { topic:"Auditors", q:"Private co filing deadline after ARD:", options:["3mo","6mo","9mo","12mo"], correct:2, exp:"9 private, 6 public." },
  { topic:"Auditors", q:"Small private audit exempt if turnover not over:", options:["GBP1m","GBP2.8m","GBP5.6m","GBP10m"], correct:2, exp:"Turnover <=GBP5.6m AND BS <=GBP2.8m." },
  { topic:"Auditors", q:"NOT a right of statutory auditor:", options:["Access books","Require info from employees","Recommend business strategy","Speak at GMs"], correct:2, exp:"Auditors check, not strategise." },
  { topic:"Auditors", q:"NOT a sec duty re meetings:", options:["Arrange Board","Provide notice","Take minutes","Vote on resolutions"], correct:3, exp:"Sec administers, doesn't vote." },
  { topic:"Auditors", q:"Private co preserves records:", options:["1yr","3yr","6yr","10yr"], correct:1, exp:"3 private, 6 public." },
  { topic:"Key Acts", q:"UK companies governed by:", options:["Company Law Act 2010","Companies Act 2006","Corp Act 1985","Companies (NI) Order 2000"], correct:1, exp:"CA 2006." },
  { topic:"Key Acts", q:"NI director disqualification governed by:", options:["CDDA 1986","Insolvency (NI) 1989","CDDO (NI) 2002","CA 2006"], correct:2, exp:"CDDO 2002." },
  { topic:"Key Acts", q:"Insider dealing under:", options:["CA 2006","CJA 1993 (updated by MAR 2016)","Theft 1968","Fraud 2006"], correct:1, exp:"CJA 1993 s.52 + MAR 2016." },
  { topic:"Key Acts", q:"Max insider dealing on indictment:", options:["5yr","7yr","10yr","Unlimited"], correct:2, exp:"10yr + unlimited fine." },
  { topic:"Key Acts", q:"Consumer protection main Act:", options:["SoGA 1979","Consumer Rights Act 2015","TDA 1968","SoGA 1982"], correct:1, exp:"CRA 2015." },
  { topic:"Key Acts", q:"Donoghue v Stevenson establishes:", options:["Contra proferentem","Duty of care + neighbour principle","Postal rule","Implied terms"], correct:1, exp:"Snail + ginger beer = duty of care foundation." },
  { topic:"Key Acts", q:"Caparo v Dickman 3-stage test for:", options:["Breach of contract","Duty of care","Vicarious liability","Remoteness"], correct:1, exp:"Foreseeability, proximity, fair just reasonable." },
  { topic:"Partner/Agency", q:"Hamlyn v Houston (1903) liability for torts:", options:["Joint only","Joint AND several","No liability","Limited"], correct:1, exp:"Joint AND several = torts." },
  { topic:"Partner/Agency", q:"New partner liable for pre-existing debts?", options:["Yes fully","Yes partially","No","Only if written"], correct:2, exp:"No, not liable for debts before joining." },
  { topic:"Partner/Agency", q:"Retiring partner indemnified by:", options:["Novation contract","Statutory declaration","Ordinary resolution","Trust deed"], correct:0, exp:"Contract of novation + notice to creditors." },
  { topic:"Partner/Agency", q:"Joint AND several liability applies to:", options:["Contracts","Torts","Both","Neither"], correct:1, exp:"Torts only. Contracts = joint only." },
  { topic:"Partner/Agency", q:"NOT a way to create agency:", options:["Agreement","Ratification","Estoppel","Statutory imposition"], correct:3, exp:"4 ways: Agreement/Ratification/Estoppel/Necessity." },
  { topic:"Partner/Agency", q:"For ratification, principal must have:", options:["Existed at time of contract","Been over 18","Filed accounts","Received payment"], correct:0, exp:"Kelner v Baxter - principal must exist." },
  { topic:"Partner/Agency", q:"Agent WITHIN authority:", options:["Personally liable to 3rd party","Liable to principal","NOT liable - only principal bound","Breach of warranty"], correct:2, exp:"Within = no personal liability." },
  { topic:"Partner/Agency", q:"Bolton Partners v Lambert - reasonable ratification time:", options:["24hr","2 weeks","3 months","6 months"], correct:1, exp:"2 weeks." },
  { topic:"Partner/Agency", q:"NOT a duty of agent:", options:["Obey instructions","Make profit for principal","Skill and care","No secret profit"], correct:1, exp:"Agent doesn't have duty to MAKE profit - that's directors." },
  { topic:"Partner/Agency", q:"Necessity agency requires:", options:["Emergency, can't reach principal, best interests","Written agreement","Payment","Court approval"], correct:0, exp:"3 conditions." },

  { topic:"Finance", q:"Which TWO correct? (1) Pref divs cumulative (2) Ord no votes (3) Authorised = max (4) Pref carry most risk", options:["1+2","1+3","2+4","3+4"], correct:1, exp:"(1) Cumulative. (3) Max. (2) Wrong - ord HAVE votes. (4) Wrong - ord most risk." },
  { topic:"Admin/Liq", q:"Two purposes of administration:", options:["Punish directors / pay shareholders","Survival + better creditor result","Wind up quickly","Replace auditor"], correct:1, exp:"Survival OR better than liquidation." },
  { topic:"Admin/Liq", q:"Who can appoint administrator:", options:["Court only","Directors only","Members + directors + creditor (via court)","Companies House only"], correct:2, exp:"3 routes." },
  { topic:"Admin/Liq", q:"Administrator calls creditor meeting within:", options:["1 week","4 weeks","10 weeks","6 months"], correct:2, exp:"10 weeks." },
  { topic:"Admin/Liq", q:"Admin moratorium lasts:", options:["3 months","6 months","12 months + 6 extension","24 months"], correct:2, exp:"12 + 6 with approval." },
  { topic:"Admin/Liq", q:"During administration company:", options:["Auto wound up","'Protected' - no proceedings, no winding up","Loses limited liability","Must change name"], correct:1, exp:"Moratorium." },
  { topic:"Admin/Liq", q:"MEMBERS' Voluntary - company must be:", options:["Insolvent","Solvent (with declaration)","Either","Public"], correct:1, exp:"Solvent. Declaration within 5 weeks of GM." },
  { topic:"Admin/Liq", q:"CREDITORS' Voluntary commences when:", options:["Petition presented","Resolution passed at GM","Companies House notified","Liquidator appointed"], correct:1, exp:"GM resolution. NOT petition." },
  { topic:"Admin/Liq", q:"COMPULSORY winding up - debt threshold + unpaid period:", options:["GBP500 / 1 week","GBP750 / 3 weeks","GBP1000 / 1 month","GBP5000 / 3 months"], correct:1, exp:"GBP750 / 3 weeks." },

  { topic:"Admin/Liq", q:"T/F: Administration = last chance, if fails -> liquidation:", options:["True","False"], correct:0, exp:"True." },
  { topic:"Admin/Liq", q:"NOT an administrator power:", options:["Manage affairs","Dispose property","Bring/defend legal action","Personally own assets"], correct:3, exp:"Cannot own personally - that's fraud." },
  { topic:"Contract", q:"Exemption clause defined:", options:["Guarantees performance","Attempts to exempt/restrict liability for breach","Penalty clause","Force majeure"], correct:1, exp:"Exclude or restrict liability." },
  { topic:"Contract", q:"Contra proferentem means:", options:["Read literally","Ambiguous against drafter","Seller wins ties","Must be in writing"], correct:1, exp:"Against the party relying on the clause." },
  { topic:"Contract", q:"Carlill v Carbolic Smoke Ball establishes:", options:["Postal rule","Unilateral contract via advert","Counter-offers terminate","Past consideration"], correct:1, exp:"Reward ad = unilateral offer. Deposit showed intention." },
  { topic:"Contract", q:"Postal rule (Adams v Lindsell):", options:["When letter arrives","When letter posted","When offeror reads","Never works"], correct:1, exp:"Effective on posting." },
  { topic:"Contract", q:"Hyde v Wrench (counter-offer):", options:["Valid acceptance","Terminates original offer","No effect","Must be in writing"], correct:1, exp:"Counter-offer rejects original." },

  { topic:"Scenarios", q:"Which TWO correct? (1) First auditor by directors (2) First auditor by shareholders (3) Removed ordinary+special notice (4) Removed special+special notice", options:["1+3","1+4","2+3","2+4"], correct:0, exp:"Directors appoint first. Ordinary res for removal." },
  { topic:"Scenarios", q:"Priority order: (A) Fixed GBP100k (B) Unsecured GBP30k (C) Statutory redundancy GBP50k (D) Floating GBP40k", options:["A B C D","A C D B","B A C D","D C A B"], correct:1, exp:"Fixed -> Preferential -> Floating -> Unsecured." },
];
let state = { filter: 'All', queue: [], currentIdx: 0, answered: 0, correct: 0, streak: 0, missed: 0, seenIds: new Set() };
const TOPICS = ['All','Topic ID','Employment','Data Protection','Business Orgs','Directors','Auditors','Key Acts','Partner/Agency','Finance','Admin/Liq','Contract','Insider Dealing','Scenarios'];
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildQueue(){let pool=state.filter==='All'?QUESTIONS:QUESTIONS.filter(q=>q.topic===state.filter);state.queue=shuffle(pool);state.currentIdx=0;}
function reshuffleQueue(){buildQueue();renderQuestion();}
function resetSession(){state={filter:state.filter,queue:[],currentIdx:0,answered:0,correct:0,streak:0,missed:0,seenIds:new Set()};buildQueue();renderAll();}
function renderChips(){const wrap=document.getElementById('topicChips');wrap.innerHTML='';TOPICS.forEach(t=>{const el=document.createElement('div');el.className='chip'+(state.filter===t?' active':'');el.textContent=t;el.onclick=()=>{state.filter=t;buildQueue();renderAll();};wrap.appendChild(el);});}
function renderQuestion(){const area=document.getElementById('quizArea');if(state.queue.length===0){area.innerHTML='<div class="card"><div class="question">No questions in this topic yet.</div></div>';return;}if(state.currentIdx>=state.queue.length){const pct=state.answered?Math.round(state.correct/state.answered*100):0;area.innerHTML=`<div class="card complete"><h2>Set complete</h2><div class="big-num">${state.correct}/${state.answered}</div><p>${pct}% in this run</p><p style="margin-top:16px;font-size:13px;color:#8b95b0;">Streak: ${state.streak} - Missed: ${state.missed}</p><button class="next-btn" style="margin-top:24px;max-width:240px;margin-left:auto;margin-right:auto;" onclick="reshuffleQueue()">Reshuffle and Go Again</button></div>`;return;}const q=state.queue[state.currentIdx];const letters=['A','B','C','D'];let labelClass='';if(q.topic==='Scenarios')labelClass='scenario';if(q.topic==='Topic ID')labelClass='topicid';area.innerHTML=`<div class="card"><div class="topic-label ${labelClass}">${q.topic}</div><div class="question">${q.q}</div><div class="options" id="options">${q.options.map((o,i)=>`<button class="option" onclick="answer(${i})"><span class="letter">${letters[i]}</span><span>${o}</span></button>`).join('')}</div><div class="feedback" id="feedback"></div><button class="next-btn" id="nextBtn" disabled onclick="next()">Next</button></div>`;}
function answer(idx){const q=state.queue[state.currentIdx];const opts=document.querySelectorAll('.option');opts.forEach((o,i)=>{o.classList.add('disabled');if(i===q.correct)o.classList.add('correct');if(i===idx&&i!==q.correct)o.classList.add('wrong');});const isCorrect=idx===q.correct;state.answered++;if(isCorrect){state.correct++;state.streak++;}else{state.streak=0;state.missed++;}state.seenIds.add(q.q);const fb=document.getElementById('feedback');fb.className='feedback show'+(isCorrect?'':' wrong-feedback');fb.innerHTML=`<strong>${isCorrect?'Correct':'Wrong - correct is '+['A','B','C','D'][q.correct]}.</strong> ${q.exp}`;document.getElementById('nextBtn').disabled=false;renderStats();}
function next(){state.currentIdx++;renderQuestion();}
function renderStats(){document.getElementById('scoreNum').textContent=state.correct+'/'+state.answered;document.getElementById('scorePct').textContent=state.answered?Math.round(state.correct/state.answered*100)+'%':'-';document.getElementById('streakNum').textContent=state.streak;document.getElementById('seenNum').textContent=state.answered;document.getElementById('missedNum').textContent=state.missed;}
function renderAll(){renderChips();renderQuestion();renderStats();}
buildQueue();renderAll();
</script>
